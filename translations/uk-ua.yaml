      email-required: Будь ласка, введіть адресу електронної пошти.
      invitation-sent-existing: Запрошення надіслано. Користувач отримає електронний лист для приєднання до вашої організації.
      invitation-sent-new: Запрошення надіслано. Створено обліковий запис з очікуванням підтвердження, і користувачеві буде запропоновано встановити пароль.
